services:
  mysql:
    image: mysql:8.0
    container_name: mysql-projets
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gestion_projets
    ports:
      - "3307:3306"
    volumes:
      - mysql_projets_data:/var/lib/mysql

volumes:
  mysql_projets_data:
